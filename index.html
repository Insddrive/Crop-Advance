<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perspective Crop App with Precision Magnifier</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 10px; 
            text-align: center; 
            color: #333; 
        }
        .app-container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        h2 { color: #1a1a1a; font-size: 22px; margin-top: 0; margin-bottom: 20px; }
        
        #loading-overlay { text-align: center; font-weight: bold; margin-bottom: 20px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; cursor: pointer; margin: 8px 4px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
        .btn:hover { background: #0056b3; }
        .btn-success { background: #28a745; display: none; }
        
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 12px 20px; cursor: pointer; background: #6c757d; color: white; border-radius: 10px; font-size: 16px; margin: 8px 4px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
        
        #controls { display: none; }
        #instructions { color: #555; font-size: 14px; margin-bottom: 15px; display: none; padding: 10px; background: #e9ecef; border-radius: 8px; }

        /* Canvas Container to hold magnifier */
        #canvas-wrapper { position: relative; margin-top: 20px; display: inline-block; }
        
        #canvas { max-width: 100%; height: auto; display: block; border-radius: 10px; cursor: crosshair; touch-action: none; background: #eee; min-height: 150px; }
        
        #outputCanvas { display: none; margin-top: 20px; border: 2px solid #28a745; border-radius: 12px; max-width: 100%; height: auto; }

        /* 🔥 MAGNIFIER STYLE 🔥 */
        #magnifierCanvas {
            position: absolute;
            width: 130px; /* UI Size */
            height: 130px; /* UI Size */
            border-radius: 50%;
            border: 4px solid #00ff00; /* Matching handle color */
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            display: none; /* Hidden by default */
            pointer-events: none; /* Crucial: clicks pass through it */
            z-index: 100;
            background-color: white;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>📸 Precision Crop App</h2>
    
    <div id="loading-overlay">
        <div class="spinner"></div>
        <span id="status-text">⏳ Loading library...</span>
    </div>
    
    <div id="controls">
        <label class="custom-file-upload">
            <input type="file" id="upload" accept="image/*">
            📁 Upload Photo
        </label>
        <button id="cropBtn" class="btn" style="display: none;">✂️ Crop & Straighten</button>
        <button id="downloadBtn" class="btn btn-success">⬇️ Download Result</button>
    </div>

    <p id="instructions"></p>

    <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
        <canvas id="magnifierCanvas"></canvas>
    </div>
    
    <canvas id="outputCanvas"></canvas>
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
    let img = new Image();
    const canvas = document.getElementById('canvas');
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const magCanvas = document.getElementById('magnifierCanvas');
    const magCtx = magCanvas.getContext('2d');
    
    const uploadInput = document.getElementById('upload');
    const cropBtn = document.getElementById('cropBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const instructions = document.getElementById('instructions');
    const loadingOverlay = document.getElementById('loading-overlay');
    const controls = document.getElementById('controls');
    const statusText = document.getElementById('status-text');

    let points = [];
    let draggingPoint = -1;
    const basePointRadius = 14; // Visible size
    const tapAreaMultiplier = 3.0; // Invisible interactive area

    // 🔥 Magnifier Configuration 🔥
    const magnifierSize = 130; // internal resolution
    const zoomFactor = 2.5; // How much to zoom

    function waitForCv(callback) {
        if (typeof cv !== 'undefined' && cv.Mat) { callback(); } 
        else { setTimeout(() => waitForCv(callback), 100); }
    }

    window.onload = function() {
        waitForCv(() => {
            loadingOverlay.style.display = 'none';
            controls.style.display = 'block';
            instructions.innerText = "Upload a photo to begin.";
            instructions.style.display = 'block';
        });
    };

    uploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                
                // Also set internal magnifier resolution
                magCanvas.width = magnifierSize;
                magCanvas.height = magnifierSize;
                
                let w = canvas.width, h = canvas.height;
                let padX = w * 0.15, padY = h * 0.15;
                points = [
                    {x: padX, y: padY}, {x: w - padX, y: padY}, 
                    {x: w - padX, y: h - padY}, {x: padX, y: h - padY}
                ];
                
                outputCanvas.style.display = 'none';
                canvas.style.display = 'block';
                cropBtn.style.display = 'inline-block';
                downloadBtn.style.display = 'none';
                instructions.innerText = "Drag the green points to the corners. Use the zoom glass at the top for precision.";
                draw();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (img.src) ctx.drawImage(img, 0, 0);

        if (points.length === 4) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.closePath();
            ctx.lineWidth = Math.max(4, canvas.width * 0.006);
            ctx.strokeStyle = '#00ff00';
            ctx.stroke();

            ctx.fillStyle = '#00ff00';
            let dynamicRadius = Math.max(basePointRadius, canvas.width * 0.015);
            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, dynamicRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }
    }

    // --- Helper for Magnifier positioning and drawing ---
    function updateMagnifier(pointPos, touchPosUI) {
        // 1. Draw zoomed content
        magCtx.save();
        // Create circular clipping path
        magCtx.beginPath();
        magCtx.arc(magnifierSize/2, magnifierSize/2, magnifierSize/2, 0, Math.PI * 2);
        magCtx.clip();
        
        // Draw the main canvas onto magnifier canvas
        // (This includes the photo, lines, and the point itself)
        const srcW = magnifierSize / zoomFactor;
        const srcH = magnifierSize / zoomFactor;
        const srcX = pointPos.x - srcW / 2;
        const srcY = pointPos.y - srcH / 2;

        magCtx.fillStyle = "white"; // Background if out of bounds
        magCtx.fillRect(0,0,magnifierSize,magnifierSize);
        magCtx.drawImage(canvas, srcX, srcY, srcW, srcH, 0, 0, magnifierSize, magnifierSize);
        magCtx.restore();

        // 2. Position the UI element
        // Offset it slightly upwards and to the left of the finger so it's not covered
        const offsetX = -magnifierSize * 0.8; 
        const offsetY = -magnifierSize * 1.2;
        
        magCanvas.style.left = (touchPosUI.left + offsetX) + 'px';
        magCanvas.style.top = (touchPosUI.top + offsetY) + 'px';
    }


    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        
        if (evt.touches && evt.touches.length > 0) {
            clientX = evt.touches[0].clientX;
            clientY = evt.touches[0].clientY;
        } else {
            clientX = evt.clientX;
            clientY = evt.clientY;
        }

        return {
            canvasCoord: {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            },
            uiCoord: {
                left: clientX - rect.left,
                top: clientY - rect.top
            }
        };
    }

    function startDrag(e) {
        if (e.target !== canvas || !img.src) return;
        if(e.cancelable) e.preventDefault(); // Good for mobile
        
        const pos = getMousePos(e);
        const dynamicRadius = Math.max(basePointRadius, canvas.width * 0.015);
        
        for (let i = 0; i < 4; i++) {
            const dx = points[i].x - pos.canvasCoord.x;
            const dy = points[i].y - pos.canvasCoord.y;
            // Larger invisible tap area
            if (Math.sqrt(dx*dx + dy*dy) < dynamicRadius * tapAreaMultiplier) {
                draggingPoint = i;
                
                // Show and place magnifier
                magCanvas.style.display = 'block';
                updateMagnifier(points[draggingPoint], pos.uiCoord);
                break;
            }
        }
    }

    function drag(e) {
        if (draggingPoint !== -1) {
            if(e.cancelable) e.preventDefault();
            const pos = getMousePos(e);
            points[draggingPoint].x = pos.canvasCoord.x;
            points[draggingPoint].y = pos.canvasCoord.y;
            
            // Draw main canvas
            draw();
            // Update zoomed view
            updateMagnifier(points[draggingPoint], pos.uiCoord);
        }
    }

    function stopDrag(e) {
        draggingPoint = -1;
        magCanvas.style.display = 'none'; // Hide magnifier
    }

    canvas.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', drag);
    window.addEventListener('mouseup', stopDrag);
    
    canvas.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', drag, {passive: false});
    window.addEventListener('touchend', stopDrag);

    cropBtn.addEventListener('click', () => {
        if (typeof cv === 'undefined' || points.length !== 4) return;
        let src = cv.imread(canvas);
        let w1 = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        let w2 = Math.hypot(points[2].x - points[3].x, points[2].y - points[3].y);
        let h1 = Math.hypot(points[0].x - points[3].x, points[0].y - points[3].y);
        let h2 = Math.hypot(points[1].x - points[2].x, points[1].y - points[2].y);
        let maxWidth = Math.max(w1, w2);
        let maxHeight = Math.max(h1, h2);
        let dsize = new cv.Size(maxWidth, maxHeight);
        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [points[0].x, points[0].y, points[1].x, points[1].y, points[2].x, points[2].y, points[3].x, points[3].y]);
        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, maxWidth, 0, maxWidth, maxHeight, 0, maxHeight]);
        let M = cv.getPerspectiveTransform(srcTri, dstTri);
        let dst = new cv.Mat();
        cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
        cv.imshow('outputCanvas', dst);
        src.delete(); dst.delete(); M.delete(); srcTri.delete(); dstTri.delete();
        canvas.style.display = 'none';
        instructions.style.display = 'none';
        cropBtn.style.display = 'none';
        outputCanvas.style.display = 'block';
        downloadBtn.style.display = 'inline-block';
    });

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'Cropped-Result.png';
        link.href = outputCanvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
