<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Precision Crop App</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 10px; 
            text-align: center; 
            color: #333; 
        }
        .app-container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        h2 { color: #1a1a1a; font-size: 22px; margin-top: 0; margin-bottom: 20px; }
        
        #loading-overlay { text-align: center; font-weight: bold; margin-bottom: 20px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; cursor: pointer; margin: 8px 4px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
        .btn:hover { background: #0056b3; }
        .btn-success { background: #28a745; display: none; }
        
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 12px 20px; cursor: pointer; background: #6c757d; color: white; border-radius: 10px; font-size: 16px; margin: 8px 4px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
        
        #controls { display: none; }
        #instructions { color: #555; font-size: 14px; margin-bottom: 15px; display: none; padding: 10px; background: #e9ecef; border-radius: 8px; }

        #canvas-wrapper { position: relative; margin-top: 20px; display: inline-block; width: 100%; }
        #canvas { max-width: 100%; height: auto; display: block; border-radius: 10px; cursor: crosshair; touch-action: none; background: #eee; margin: 0 auto; }
        #outputCanvas { display: none; margin-top: 20px; border: 2px solid #28a745; border-radius: 12px; max-width: 100%; height: auto; margin: 0 auto; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>📸 Advanced Precision Crop</h2>
    
    <div id="loading-overlay">
        <div class="spinner"></div>
        <span id="status-text">⏳ Loading system...</span>
    </div>
    
    <div id="controls">
        <label class="custom-file-upload">
            <input type="file" id="upload" accept="image/*">
            📁 Upload Photo
        </label>
        <button id="cropBtn" class="btn" style="display: none;">✂️ Crop & Straighten</button>
        <button id="downloadBtn" class="btn btn-success">⬇️ Download Clean Photo</button>
    </div>

    <p id="instructions"></p>

    <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>
    
    <canvas id="outputCanvas"></canvas>
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
    let img = new Image();
    const canvas = document.getElementById('canvas');
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    
    const uploadInput = document.getElementById('upload');
    const cropBtn = document.getElementById('cropBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const instructions = document.getElementById('instructions');
    const loadingOverlay = document.getElementById('loading-overlay');
    const controls = document.getElementById('controls');

    let points = [];
    let draggingPoint = -1;
    let dragOffset = {x: 0, y: 0}; // ਉਂਗਲ ਅਤੇ ਮੇਨ ਪੁਆਇੰਟ ਵਿਚਲੀ ਦੂਰੀ ਸੇਵ ਕਰਨ ਲਈ

    function waitForCv(callback) {
        if (typeof cv !== 'undefined' && cv.Mat) { callback(); } 
        else { setTimeout(() => waitForCv(callback), 100); }
    }

    window.onload = function() {
        waitForCv(() => {
            loadingOverlay.style.display = 'none';
            controls.style.display = 'block';
            instructions.innerText = "Upload a photo to begin.";
            instructions.style.display = 'block';
        });
    };

    uploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                
                let w = canvas.width, h = canvas.height;
                let padX = w * 0.15, padY = h * 0.15;
                points = [
                    {x: padX, y: padY}, {x: w - padX, y: padY}, 
                    {x: w - padX, y: h - padY}, {x: padX, y: h - padY}
                ];
                
                outputCanvas.style.display = 'none';
                canvas.style.display = 'block';
                cropBtn.style.display = 'inline-block';
                downloadBtn.style.display = 'none';
                instructions.innerText = "Drag the inner Blue handles. The green circles will show a zoomed view.";
                draw(); // UI ਦੇ ਨਾਲ ਡਰਾਅ ਕਰੋ
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // ਅੰਦਰਲੇ ਛੋਟੇ ਹੈਂਡਲਸ (Blue Dots) ਦੀ ਪੋਜੀਸ਼ਨ ਕੱਢਣ ਦਾ ਫੰਕਸ਼ਨ
    function getInnerHandles() {
        // ਚਾਰੇ ਪੁਆਇੰਟਸ ਦਾ ਸੈਂਟਰ (Center) ਲੱਭਣਾ
        let cx = (points[0].x + points[1].x + points[2].x + points[3].x) / 4;
        let cy = (points[0].y + points[1].y + points[2].y + points[3].y) / 4;
        
        // ਛੋਟੇ ਹੈਂਡਲ ਨੂੰ ਮੇਨ ਹੈਂਡਲ ਤੋਂ ਕਿੰਨਾ ਅੰਦਰ ਰੱਖਣਾ ਹੈ (ਡਾਇਨਾਮਿਕ ਸਾਈਜ਼)
        let offsetDistance = Math.max(50, canvas.width * 0.08); 
        
        return points.map(p => {
            let dx = cx - p.x;
            let dy = cy - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist === 0) return {x: p.x, y: p.y};
            return { x: p.x + (dx/dist) * offsetDistance, y: p.y + (dy/dist) * offsetDistance };
        });
    }

    // showUI=false ਕਰਨ ਨਾਲ ਸਾਰੀਆਂ ਹਰੀਆਂ ਲਾਈਨਾਂ ਹਾਈਡ ਹੋ ਜਾਣਗੀਆਂ
    function draw(showUI = true) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (img.src) ctx.drawImage(img, 0, 0);

        if (showUI && points.length === 4) {
            // 1. ਮੇਨ ਚੌਕੋਰ ਲਾਈਨਾਂ ਡਰਾਅ ਕਰਨਾ
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.closePath();
            ctx.lineWidth = Math.max(3, canvas.width * 0.005);
            ctx.strokeStyle = '#00ff00';
            ctx.stroke();

            let innerHandles = getInnerHandles();
            let magRadius = Math.max(35, canvas.width * 0.05); // ਮੈਗਨੀਫਾਇੰਗ ਗਲਾਸ ਦਾ ਸਾਈਜ਼

            for (let i = 0; i < 4; i++) {
                let p = points[i];
                let grabP = innerHandles[i];

                // 2. ਮੇਨ ਪੁਆਇੰਟ ਤੋਂ ਛੋਟੇ ਹੈਂਡਲ ਤੱਕ ਲਾਈਨ
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(grabP.x, grabP.y);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#00ff00';
                ctx.stroke();

                // 3. ਮੇਨ ਹੈਂਡਲ (ਜੋ ਕਿ ਹੁਣ ਜ਼ੂਮ ਲੈਨਜ਼/Magnifier ਹੈ)
                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x, p.y, magRadius, 0, Math.PI * 2);
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#00ff00';
                ctx.stroke();
                ctx.clip(); // ਇਸ ਗੋਲੇ ਦੇ ਅੰਦਰ ਹੀ ਜ਼ੂਮ ਵਾਲੀ ਫੋਟੋ ਦਿਖੇਗੀ
                
                let zoomFactor = 2.0; // ਕਿੰਨਾ ਗੁਣਾ ਜ਼ੂਮ ਕਰਨਾ ਹੈ
                let srcW = (magRadius * 2) / zoomFactor;
                let srcH = (magRadius * 2) / zoomFactor;
                let srcX = p.x - srcW / 2;
                let srcY = p.y - srcH / 2;
                
                // ਜ਼ੂਮ ਕੀਤੀ ਫੋਟੋ ਡਰਾਅ ਕਰਨਾ (ਓਰੀਜਨਲ ਫੋਟੋ ਤੋਂ)
                ctx.fillStyle = "white"; ctx.fill();
                ctx.drawImage(img, srcX, srcY, srcW, srcH, p.x - magRadius, p.y - magRadius, magRadius * 2, magRadius * 2);
                
                // ਜ਼ੂਮ ਲੈਨਜ਼ ਦੇ ਵਿਚਕਾਰ ਇੱਕ ਛੋਟਾ ਲਾਲ ਨਿਸ਼ਾਨ (Crosshair)
                ctx.beginPath();
                ctx.moveTo(p.x - 8, p.y); ctx.lineTo(p.x + 8, p.y);
                ctx.moveTo(p.x, p.y - 8); ctx.lineTo(p.x, p.y + 8);
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                // 4. ਅੰਦਰਲਾ ਛੋਟਾ ਹੈਂਡਲ (ਜਿਸਨੂੰ ਉਂਗਲ ਨਾਲ ਫੜਨਾ ਹੈ)
                ctx.beginPath();
                ctx.arc(grabP.x, grabP.y, Math.max(16, canvas.width * 0.025), 0, Math.PI * 2);
                ctx.fillStyle = '#007bff'; // ਨੀਲਾ ਰੰਗ
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'white';
                ctx.stroke();
            }
        }
    }

    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX = evt.clientX, clientY = evt.clientY;
        if (evt.touches && evt.touches.length > 0) {
            clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
        }
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDrag(e) {
        if (e.target !== canvas || !img.src) return;
        if(e.cancelable) e.preventDefault(); 
        
        const pos = getMousePos(e);
        let innerHandles = getInnerHandles();
        let hitRadius = Math.max(30, canvas.width * 0.04); // ਫੜਨ ਦਾ ਏਰੀਆ
        
        for (let i = 0; i < 4; i++) {
            // ਅਸੀਂ ਚੈੱਕ ਕਰਨਾ ਹੈ ਕਿ ਉਂਗਲ ਮੇਨ ਪੁਆਇੰਟ 'ਤੇ ਨਹੀਂ, ਬਲਕਿ ਛੋਟੇ 'Blue' ਹੈਂਡਲ 'ਤੇ ਹੈ
            const dx = innerHandles[i].x - pos.x;
            const dy = innerHandles[i].y - pos.y;
            
            if (Math.sqrt(dx*dx + dy*dy) < hitRadius * 2) {
                draggingPoint = i;
                // ਉਂਗਲ ਦੀ ਪੋਜੀਸ਼ਨ ਅਤੇ ਅਸਲ ਕਿਨਾਰੇ ਦਾ ਫਾਸਲਾ ਸੇਵ ਕਰਨਾ
                dragOffset = { x: points[i].x - innerHandles[i].x, y: points[i].y - innerHandles[i].y };
                break;
            }
        }
    }

    function drag(e) {
        if (draggingPoint !== -1) {
            if(e.cancelable) e.preventDefault();
            const pos = getMousePos(e);
            // ਮੇਨ ਪੁਆਇੰਟ ਨੂੰ ਉਂਗਲ ਦੇ ਹਿਸਾਬ ਨਾਲ ਮੂਵ ਕਰਨਾ
            points[draggingPoint].x = pos.x + dragOffset.x;
            points[draggingPoint].y = pos.y + dragOffset.y;
            draw();
        }
    }

    function stopDrag(e) { draggingPoint = -1; }

    canvas.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', drag);
    window.addEventListener('mouseup', stopDrag);
    
    canvas.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', drag, {passive: false});
    window.addEventListener('touchend', stopDrag);

    // ਕਰੋਪ ਬਟਨ ਦਾ ਫੰਕਸ਼ਨ
    cropBtn.addEventListener('click', () => {
        if (typeof cv === 'undefined' || points.length !== 4) return;

        // 🔥 ਗ੍ਰੀਨ ਲਾਈਨਾਂ ਦਾ ਹੱਲ: ਕਰੋਪ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਲਾਈਨਾਂ ਹਟਾਓ 🔥
        draw(false); 
        
        let src = cv.imread(canvas);

        let w1 = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        let w2 = Math.hypot(points[2].x - points[3].x, points[2].y - points[3].y);
        let h1 = Math.hypot(points[0].x - points[3].x, points[0].y - points[3].y);
        let h2 = Math.hypot(points[1].x - points[2].x, points[1].y - points[2].y);
        let maxWidth = Math.max(w1, w2);
        let maxHeight = Math.max(h1, h2);

        let dsize = new cv.Size(maxWidth, maxHeight);
        
        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
            points[0].x, points[0].y, points[1].x, points[1].y,
            points[2].x, points[2].y, points[3].x, points[3].y
        ]);
        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
            0, 0, maxWidth, 0, maxWidth, maxHeight, 0, maxHeight
        ]);

        let M = cv.getPerspectiveTransform(srcTri, dstTri);
        let dst = new cv.Mat();
        
        cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

        cv.imshow('outputCanvas', dst);

        src.delete(); dst.delete(); M.delete(); srcTri.delete(); dstTri.delete();

        canvas.style.display = 'none';
        instructions.style.display = 'none';
        cropBtn.style.display = 'none';
        outputCanvas.style.display = 'block';
        downloadBtn.style.display = 'inline-block';
    });

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'Clean-Cropped-Photo.png';
        link.href = outputCanvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
