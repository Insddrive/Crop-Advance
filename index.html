<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HD Precision Crop App</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 10px; 
            text-align: center; 
            color: #333; 
        }
        .app-container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }
        h2 { color: #1a1a1a; font-size: 22px; margin-top: 0; margin-bottom: 20px; }
        
        #loading-overlay { text-align: center; font-weight: bold; margin-bottom: 20px; color: #007bff; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; cursor: pointer; margin: 8px 4px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
        .btn:hover { background: #0056b3; }
        .btn-success { background: #28a745; display: none; }
        
        input[type="file"] { display: none; }
        .custom-file-upload { display: inline-block; padding: 12px 20px; cursor: pointer; background: #6c757d; color: white; border-radius: 10px; font-size: 16px; margin: 8px 4px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
        
        #controls { display: none; }
        #instructions { color: #555; font-size: 14px; margin-bottom: 15px; display: none; padding: 10px; background: #e9ecef; border-radius: 8px; font-weight: bold; }

        #canvas-wrapper { position: relative; margin-top: 20px; display: inline-block; width: 100%; }
        
        /* ਕੈਨਵਸ ਦੀ ਦਿੱਖ ਜੋ ਫੋਨ 'ਤੇ ਫਿੱਟ ਆਵੇਗੀ, ਪਰ ਅਸਲ ਕੁਆਲਿਟੀ HD ਹੀ ਰਹੇਗੀ */
        #canvas { max-width: 100%; height: auto; display: block; border-radius: 10px; cursor: crosshair; touch-action: none; background: #eee; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        #outputCanvas { display: none; margin-top: 20px; border: 3px solid #28a745; border-radius: 12px; max-width: 100%; height: auto; margin: 0 auto; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>📸 HD Precision Crop</h2>
    
    <div id="loading-overlay">
        <div class="spinner"></div>
        <span id="status-text">⏳ ਸਿਸਟਮ ਤਿਆਰ ਹੋ ਰਿਹਾ ਹੈ...</span>
    </div>
    
    <div id="controls">
        <label class="custom-file-upload">
            <input type="file" id="upload" accept="image/*">
            📁 ਫੋਟੋ ਅਪਲੋਡ ਕਰੋ
        </label>
        <button id="cropBtn" class="btn" style="display: none;">✂️ HD ਕਰੋਪ ਕਰੋ</button>
        <button id="downloadBtn" class="btn btn-success">⬇️ HD ਫੋਟੋ ਡਾਊਨਲੋਡ ਕਰੋ</button>
    </div>

    <p id="instructions"></p>

    <img id="sourceImage" style="display: none;">

    <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>
    
    <canvas id="outputCanvas"></canvas>
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
    const sourceImage = document.getElementById('sourceImage');
    const canvas = document.getElementById('canvas');
    const outputCanvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    
    const uploadInput = document.getElementById('upload');
    const cropBtn = document.getElementById('cropBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const instructions = document.getElementById('instructions');
    const loadingOverlay = document.getElementById('loading-overlay');
    const controls = document.getElementById('controls');

    let points = [];
    let draggingPoint = -1;
    let dragOffset = {x: 0, y: 0};

    function waitForCv(callback) {
        if (typeof cv !== 'undefined' && cv.Mat) { callback(); } 
        else { setTimeout(() => waitForCv(callback), 100); }
    }

    window.onload = function() {
        waitForCv(() => {
            loadingOverlay.style.display = 'none';
            controls.style.display = 'block';
            instructions.innerText = "ਸ਼ੁਰੂ ਕਰਨ ਲਈ ਕੋਈ ਫੋਟੋ ਅਪਲੋਡ ਕਰੋ।";
            instructions.style.display = 'block';
        });
    };

    uploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            sourceImage.onload = () => {
                // ਕੈਨਵਸ ਨੂੰ ਅਸਲੀ HD ਫੋਟੋ ਦੇ ਸਾਈਜ਼ ਮੁਤਾਬਕ ਸੈੱਟ ਕਰਨਾ
                canvas.width = sourceImage.width;
                canvas.height = sourceImage.height;
                
                let w = canvas.width, h = canvas.height;
                let padX = w * 0.15, padY = h * 0.15;
                points = [
                    {x: padX, y: padY}, {x: w - padX, y: padY}, 
                    {x: w - padX, y: h - padY}, {x: padX, y: h - padY}
                ];
                
                outputCanvas.style.display = 'none';
                canvas.style.display = 'block';
                cropBtn.style.display = 'inline-block';
                downloadBtn.style.display = 'none';
                instructions.innerText = "ਨੀਲੇ ਬਿੰਦੂਆਂ ਨੂੰ ਖਿੱਚੋ। ਹਰੇ ਗੋਲੇ ਵਿੱਚ ਤੁਹਾਨੂੰ ਜ਼ੂਮ ਹੋਈ ਫੋਟੋ ਸਾਫ਼ ਦਿਖੇਗੀ।";
                draw();
            };
            sourceImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function getInnerHandles() {
        let cx = (points[0].x + points[1].x + points[2].x + points[3].x) / 4;
        let cy = (points[0].y + points[1].y + points[2].y + points[3].y) / 4;
        let offsetDistance = Math.max(50, canvas.width * 0.08); 
        
        return points.map(p => {
            let dx = cx - p.x;
            let dy = cy - p.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist === 0) return {x: p.x, y: p.y};
            return { x: p.x + (dx/dist) * offsetDistance, y: p.y + (dy/dist) * offsetDistance };
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (sourceImage.src) ctx.drawImage(sourceImage, 0, 0);

        if (points.length === 4) {
            // 1. ਮੇਨ ਚੌਕੋਰ ਲਾਈਨਾਂ 
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < 4; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.closePath();
            ctx.lineWidth = Math.max(4, canvas.width * 0.005);
            ctx.strokeStyle = '#00ff00';
            ctx.stroke();

            let innerHandles = getInnerHandles();
            let magRadius = Math.max(40, canvas.width * 0.06); 

            for (let i = 0; i < 4; i++) {
                let p = points[i];
                let grabP = innerHandles[i];

                // 2. ਲਾਈਨ ਜੋ ਨੀਲੇ ਹੈਂਡਲ ਨੂੰ ਗੋਲੇ ਨਾਲ ਜੋੜਦੀ ਹੈ
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(grabP.x, grabP.y);
                ctx.lineWidth = Math.max(3, canvas.width * 0.004);
                ctx.strokeStyle = '#00ff00';
                ctx.stroke();

                // 3. ਜ਼ੂਮ ਲੈਨਜ਼ (ਹੁਣ ਫੋਟੋ ਸਾਫ਼ ਦਿਖੇਗੀ)
                ctx.save();
                ctx.beginPath();
                ctx.arc(p.x, p.y, magRadius, 0, Math.PI * 2);
                ctx.lineWidth = Math.max(6, canvas.width * 0.008);
                ctx.strokeStyle = '#00ff00';
                ctx.stroke(); // ਹਰਾ ਬਾਰਡਰ ਬਣਾਓ
                ctx.clip(); // ਗੋਲੇ ਦੇ ਅੰਦਰ ਹੀ ਰੱਖੋ
                
                // ਜ਼ੂਮ ਕਰਨ ਦੀ ਅਸਲ ਤਕਨੀਕ: ਫੋਟੋ ਨੂੰ ਵੱਡਾ ਕਰਕੇ ਉਸ ਪੁਆਇੰਟ 'ਤੇ ਰੱਖਣਾ
                ctx.translate(p.x, p.y);
                ctx.scale(2.5, 2.5); // 2.5 ਗੁਣਾ ਜ਼ੂਮ
                ctx.translate(-p.x, -p.y);
                ctx.drawImage(sourceImage, 0, 0); 
                ctx.restore();

                // 4. ਜ਼ੂਮ ਲੈਨਜ਼ ਦੇ ਵਿਚਕਾਰ ਲਾਲ Crosshair (+)
                ctx.beginPath();
                let crossSize = Math.max(10, canvas.width * 0.015);
                ctx.moveTo(p.x - crossSize, p.y); ctx.lineTo(p.x + crossSize, p.y);
                ctx.moveTo(p.x, p.y - crossSize); ctx.lineTo(p.x, p.y + crossSize);
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = Math.max(3, canvas.width * 0.003);
                ctx.stroke();

                // 5. ਅੰਦਰਲਾ ਨੀਲਾ ਹੈਂਡਲ (ਫੜਨ ਲਈ)
                ctx.beginPath();
                ctx.arc(grabP.x, grabP.y, Math.max(20, canvas.width * 0.03), 0, Math.PI * 2);
                ctx.fillStyle = '#007bff';
                ctx.fill();
                ctx.lineWidth = Math.max(3, canvas.width * 0.004);
                ctx.strokeStyle = 'white';
                ctx.stroke();
            }
        }
    }

    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX = evt.clientX, clientY = evt.clientY;
        if (evt.touches && evt.touches.length > 0) {
            clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
        }
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDrag(e) {
        if (e.target !== canvas || !sourceImage.src) return;
        if(e.cancelable) e.preventDefault(); 
        
        const pos = getMousePos(e);
        let innerHandles = getInnerHandles();
        let hitRadius = Math.max(40, canvas.width * 0.05); // ਟੱਚ ਕਰਨ ਦਾ ਏਰੀਆ ਵੱਡਾ ਕੀਤਾ ਹੈ
        
        for (let i = 0; i < 4; i++) {
            const dx = innerHandles[i].x - pos.x;
            const dy = innerHandles[i].y - pos.y;
            
            if (Math.sqrt(dx*dx + dy*dy) < hitRadius * 1.5) {
                draggingPoint = i;
                dragOffset = { x: points[i].x - innerHandles[i].x, y: points[i].y - innerHandles[i].y };
                break;
            }
        }
    }

    function drag(e) {
        if (draggingPoint !== -1) {
            if(e.cancelable) e.preventDefault();
            const pos = getMousePos(e);
            points[draggingPoint].x = pos.x + dragOffset.x;
            points[draggingPoint].y = pos.y + dragOffset.y;
            draw();
        }
    }

    function stopDrag(e) { draggingPoint = -1; }

    canvas.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', drag);
    window.addEventListener('mouseup', stopDrag);
    
    canvas.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', drag, {passive: false});
    window.addEventListener('touchend', stopDrag);

    // HD ਕਰੋਪ ਫੰਕਸ਼ਨ
    cropBtn.addEventListener('click', () => {
        if (typeof cv === 'undefined' || points.length !== 4) return;

        // ਯੂਜ਼ਰ ਨੂੰ ਦੱਸਣ ਲਈ ਕਿ HD ਫੋਟੋ ਤਿਆਰ ਹੋ ਰਹੀ ਹੈ
        instructions.innerText = "⏳ HD ਫੋਟੋ ਤਿਆਰ ਹੋ ਰਹੀ ਹੈ, ਕਿਰਪਾ ਕਰਕੇ ਉਡੀਕ ਕਰੋ...";
        cropBtn.style.opacity = '0.5';
        
        // ਥੋੜ੍ਹਾ ਸਮਾਂ ਦੇਣਾ ਤਾਂ ਜੋ ਬ੍ਰਾਊਜ਼ਰ ਟੈਕਸਟ ਨੂੰ ਅਪਡੇਟ ਕਰ ਸਕੇ
        setTimeout(() => {
            // 🔥 ਅਸਲੀ (Hidden) ਫੋਟੋ ਤੋਂ ਸਿੱਧਾ ਡਾਟਾ ਲੈਣਾ (ਇਸ ਲਈ ਕੋਈ ਹਰੀ ਲਾਈਨ ਨਹੀਂ ਆਵੇਗੀ) 🔥
            let src = cv.imread(sourceImage);

            let w1 = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
            let w2 = Math.hypot(points[2].x - points[3].x, points[2].y - points[3].y);
            let h1 = Math.hypot(points[0].x - points[3].x, points[0].y - points[3].y);
            let h2 = Math.hypot(points[1].x - points[2].x, points[1].y - points[2].y);
            let maxWidth = Math.max(w1, w2);
            let maxHeight = Math.max(h1, h2);

            let dsize = new cv.Size(maxWidth, maxHeight);
            
            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                points[0].x, points[0].y, points[1].x, points[1].y,
                points[2].x, points[2].y, points[3].x, points[3].y
            ]);
            let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                0, 0, maxWidth, 0, maxWidth, maxHeight, 0, maxHeight
            ]);

            let M = cv.getPerspectiveTransform(srcTri, dstTri);
            let dst = new cv.Mat();
            
            // HD ਪ੍ਰੋਸੈਸਿੰਗ
            cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

            cv.imshow('outputCanvas', dst);

            // ਮੈਮਰੀ ਖਾਲੀ ਕਰਨਾ
            src.delete(); dst.delete(); M.delete(); srcTri.delete(); dstTri.delete();

            // UI ਸੈੱਟਅੱਪ
            canvas.style.display = 'none';
            instructions.style.display = 'none';
            cropBtn.style.display = 'none';
            outputCanvas.style.display = 'block';
            downloadBtn.style.display = 'inline-block';
            cropBtn.style.opacity = '1';
        }, 100);
    });

    // HD ਫੋਟੋ ਡਾਊਨਲੋਡ ਕਰਨ ਲਈ (JPEG ਫਾਰਮੈਟ ਦੀ ਵਰਤੋਂ ਤਾਂ ਜੋ ਸਾਈਜ਼ ਠੀਕ ਰਹੇ ਅਤੇ ਕੁਆਲਿਟੀ ਵੀ)
    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'HD-Cropped-Photo.jpg';
        // 1.0 ਦਾ ਮਤਲਬ ਹੈ 100% ਕੁਆਲਿਟੀ
        link.href = outputCanvas.toDataURL('image/jpeg', 1.0);
        link.click();
    });
</script>

</body>
</html>
